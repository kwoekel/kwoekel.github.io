<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AI systems that make running a business feel lighter. Connect with Kierra Woekel.">
  <meta name="theme-color" content="#7ADBC3">
  <title>Kierra Woekel — AI systems that make business feel lighter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231B1B1C'/><circle cx='22' cy='22' r='5' fill='%23D2FF00'/></svg>">
  <style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --ink: #1b1b1c;
      --quiet: #646465;
      --sulfur: #d2ff00;
      --mint: #7ADBC3;
      --gut: clamp(20px, 5vw, 72px);
    }
    * { box-sizing: border-box; }
    html { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    ::selection { color: var(--ink); background: var(--sulfur); }
    .site-nav {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: min(820px, calc(100% - 32px)); padding: 7px 8px 7px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid rgba(27, 27, 28, .18); border-radius: 999px;
      background: var(--paper); box-shadow: 0 10px 34px rgba(27, 27, 28, .08);
    }
    .wordmark { font-size: 21px; font-weight: 780; letter-spacing: -.05em; line-height: 1; white-space: nowrap; }
    .hero {
      min-height: 100svh; display: flex; flex-direction: column;
      gap: clamp(32px, 4svh, 48px);
      padding: clamp(116px, 14svh, 170px) var(--gut) clamp(40px, 6svh, 68px);
    }
    h1 {
      max-width: none; margin: 0;
      font-size: clamp(55px, 10.6vw, 190px); font-weight: 490;
      line-height: .88; letter-spacing: -.07em; text-wrap: balance;
    }
    .glue {
      position: relative; z-index: 0; display: inline-block; white-space: nowrap;
      animation: glue-rise 1s .15s cubic-bezier(.19, 1, .22, 1) both;
    }
    @keyframes glue-rise {
      from { opacity: 0; transform: translateY(.6em) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .glue::after {
      content: ""; position: absolute; z-index: -1; left: -.02em; right: -.04em;
      bottom: -.205em; height: .11em; background: var(--sulfur);
      transform: scaleX(0); transform-origin: left center;
      animation: underline-in 1.05s .75s cubic-bezier(.19, 1, .22, 1) both;
    }
    @keyframes underline-in {
      0% { transform: scaleX(0) scaleY(.5); }
      75% { transform: scaleX(1.06) scaleY(1.15); }
      100% { transform: scaleX(1) scaleY(1); }
    }
    .hero__lower { max-width: 1180px; }
    .hero__sub { margin: 0; font-size: clamp(24px, 3.1vw, 46px); line-height: 1.35; color: var(--quiet); }
    .hero__sub strong {
      position: relative; display: block; overflow: hidden;
      color: var(--mint); font-weight: 700;
    }
    .hero__sub strong span { display: block; animation: phrase-reveal 1.1s .6s both; }
    .hero__sub strong::after {
      content: ""; position: absolute; z-index: 1; inset: 0;
      background: var(--sulfur); transform: translateX(-101%);
      animation: sulfur-swipe 1.1s .6s ease-in-out both;
    }
    @keyframes phrase-reveal {
      0%, 44% { opacity: 0; }
      45%, 100% { opacity: 1; }
    }
    @keyframes sulfur-swipe {
      0% { transform: translateX(-101%); }
      45% { transform: translateX(0); }
      100% { transform: translateX(101%); }
    }
    .hero__cat {
      display: flex; align-items: center; gap: 12px; margin: 22px 0 0;
      font-size: clamp(20px, 2vw, 30px); font-weight: 760; letter-spacing: -.025em;
    }
    .hero__cat::before { content: ""; width: 28px; height: 8px; flex: none; background: var(--sulfur); }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 11px 17px; border: 1px solid var(--ink); border-radius: 999px;
      background: var(--sulfur); text-decoration: none; font-size: 14px;
      font-weight: 760; white-space: nowrap;
    }
    .button:hover { color: var(--paper); background: var(--ink); }
    @media (max-width: 600px) {
      .site-nav { padding-left: 17px; }
      .wordmark { font-size: 18px; }
      .hero { padding-top: 112px; padding-bottom: max(36px, env(safe-area-inset-bottom)); }
      h1 { font-size: clamp(56px, 19.2vw, 78px); line-height: .92; }
      .hero__sub { font-size: clamp(21px, 6.15vw, 25px); line-height: 1.3; }
      .hero__cat {
        margin-top: 28px; font-size: 20px; line-height: 1.3;
        letter-spacing: 0; text-transform: none;
      }
    }
    @media (max-width: 600px) and (max-height: 740px) {
      .hero { padding-top: 100px; gap: 36px; }
      h1 { font-size: clamp(54px, 9.2svh, 64px); }
      .hero__sub { font-size: 21px; }
      .hero__cat { margin-top: 22px; font-size: 19px; }
    }
    @media (max-width: 360px) and (max-height: 650px) {
      .hero { padding-top: 92px; padding-bottom: 28px; gap: 26px; }
      h1 { font-size: 50px; }
      .hero__sub { font-size: 19px; }
      .hero__cat { margin-top: 16px; font-size: 17px; }
    }
    @media (min-height: 900px) and (max-width: 600px) {
      .hero { padding-top: 140px; gap: 40px; }
      .hero__sub { font-size: 26px; }
      .hero__cat { margin-top: 38px; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glue, .glue::after, .hero__sub strong span { animation: none; transform: none; opacity: 1; }
      .hero__sub strong::after { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <span class="wordmark">Kierra Woekel</span>
    <a class="button" href="mailto:kierrawoekel@gmail.com" aria-label="Let's Connect by email">Let's Connect</a>
  </header>
  <main class="hero" aria-label="Introduction">
    <h1>Your business shouldn't need you to be the <span class="glue">glue.</span></h1>
    <div class="hero__lower">
      <p class="hero__sub">Automation that takes the mental load off your plate — <strong><span>built for anyone drowning in the doing.</span></strong></p>
      <p class="hero__cat">AI systems that make running a business feel lighter.</p>
    </div>
  </main>
</body>
</html>
