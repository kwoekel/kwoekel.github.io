<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AI systems that make running a business feel lighter. Connect with Kierra Woekel.">
  <meta name="theme-color" content="#ffffff">
  <title>Kierra Woekel — AI systems that make business feel lighter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231B1B1C'/><circle cx='22' cy='22' r='5' fill='%23D2FF00'/></svg>">
  <style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --ink: #1b1b1c;
      --quiet: #646465;
      --sulfur: #d2ff00;
      --purple: #8f2f98;
      --gut: clamp(20px, 5vw, 72px);
    }
    * { box-sizing: border-box; }
    html { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--purple); outline-offset: 5px; }
    ::selection { color: var(--ink); background: var(--sulfur); }
    .site-nav {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: min(820px, calc(100% - 32px)); padding: 17px 20px;
      border: 1px solid rgba(27, 27, 28, .18); border-radius: 999px;
      background: var(--paper); box-shadow: 0 10px 34px rgba(27, 27, 28, .08);
    }
    .wordmark { font-size: 21px; font-weight: 780; letter-spacing: -.06em; line-height: 1; text-decoration: none; }
    .wordmark i { color: #a5c900; font-style: normal; }
    .hero {
      min-height: 100svh; display: grid; align-content: end;
      padding: 118px var(--gut) clamp(48px, 8vw, 84px);
    }
    h1 {
      max-width: 1460px; margin: 0 0 30px;
      font-size: clamp(55px, 9.5vw, 142px); font-weight: 490;
      line-height: .88; letter-spacing: -.07em; text-wrap: balance;
    }
    .glue { position: relative; z-index: 0; white-space: nowrap; }
    .glue::after {
      content: ""; position: absolute; z-index: -1; left: -.02em; right: -.04em;
      bottom: .05em; height: .19em; background: var(--sulfur);
    }
    .hero__lower { max-width: 760px; }
    .hero__sub { margin: 0; font-size: clamp(17px, 1.4vw, 21px); line-height: 1.4; color: var(--quiet); }
    .hero__sub strong { display: block; color: var(--purple); font-weight: 650; }
    .hero__cat {
      display: flex; align-items: center; gap: 12px; margin: 22px 0 0;
      font-size: 12px; font-weight: 760; letter-spacing: .1em; text-transform: uppercase;
    }
    .hero__cat::before { content: ""; width: 28px; height: 8px; flex: none; background: var(--sulfur); }
    .hero__cta { margin: 26px 0 0; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
      padding: 12px 20px; border: 1px solid var(--ink); background: var(--sulfur);
      text-decoration: none; font-size: 12px; font-weight: 760; text-transform: uppercase;
      letter-spacing: .045em;
    }
    .button:hover { color: var(--paper); background: var(--ink); }
    .contact { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 18px 0 0; font-size: 15px; line-height: 1.5; }
    .contact a { overflow-wrap: anywhere; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    @media (max-width: 600px) {
      .hero { min-height: 100svh; padding-top: 110px; }
      h1 { font-size: clamp(52px, 12vw, 72px); line-height: .91; }
      .contact { display: grid; gap: 4px; }
    }
  </style>
</head>
<body>
  <header class="site-nav"><span class="wordmark">kierra<i>.</i></span></header>
  <main class="hero" aria-label="Introduction">
    <h1>Your business shouldn't need you to be the <span class="glue">glue.</span></h1>
    <div class="hero__lower">
      <p class="hero__sub">Automation that takes the mental load off your plate — <strong>built for anyone drowning in the doing.</strong></p>
      <p class="hero__cat">AI systems that make running a business feel lighter.</p>
      <p class="hero__cta"><a class="button" href="mailto:kierrawoekel@gmail.com">Email me</a></p>
      <p class="contact"><a href="mailto:kierrawoekel@gmail.com">kierrawoekel@gmail.com</a><a href="tel:+15414500680">541-450-0680</a></p>
    </div>
  </main>
</body>
</html>
